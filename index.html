<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>
  <style>
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      color: white;
    }
    img {
      max-width: 850px;
      width: 95%;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
    }
    button {
      background: #e94560;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover { background: #c73652; }
    button:disabled { background: #555; cursor: default; }
    #pageNum {
      font-size: 18px;
      min-width: 80px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>📁 Portfolio</h2>
  <img id="slide" src="images/page1.png" alt="Portfolio Page">
  <div class="controls">
    <button id="prev" onclick="changePage(-1)" disabled>◀ ก่อนหน้า</button>
    <span id="pageNum">1 / 13</span>
    <button id="next" onclick="changePage(1)">ถัดไป ▶</button>
  </div>

  <script>
    let current = 1;
    const total = 13;

    function changePage(dir) {
      current += dir;
      document.getElementById('slide').src = 'images/page' + current + '.png';
      document.getElementById('pageNum').textContent = current + ' / ' + total;
      document.getElementById('prev').disabled = current === 1;
      document.getElementById('next').disabled = current === total;
    }
  </script>
</body>
</html>
